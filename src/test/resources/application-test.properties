# Профиль для тестов (практика 5).
# Тесты НЕ ходят в рабочую PostgreSQL library_db: используется H2 в памяти.
#
# ВАЖНО про url: БД должна быть уникальной на каждый Spring-контекст.
# Spring кэширует контексты, и тестовые классы с разной конфигурацией
# (@AutoConfigureMockMvc(addFilters = false) / @AutoConfigureMockMvc) поднимают
# РАЗНЫЕ контексты. При фиксированном имени (jdbc:h2:mem:testdb) второй контекст
# при старте выполняет drop table ... cascade и удаляет схему, которую ещё
# использует первый. ${random.uuid} даёт каждому контексту свою базу.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
